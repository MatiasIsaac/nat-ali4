<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirameter - Acceso Administrador</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0d0614;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(135deg, #0f3e54 0%, #1b0e24 50%, #5c140a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  #net {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    opacity: 0.4;
  }
  
  .login-card {
    position: relative;
    width: 85%;
    max-width: 380px;
    background: rgba(255, 255, 255, 0.03);
    padding: 40px 30px;
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    z-index: 5;
    box-sizing: border-box;
  }

  .login-card h2 {
    color: #fff;
    margin: 0 0 10px 0;
    font-size: 22px;
    font-weight: 600;
    text-align: center;
  }

  .login-card p {
    color: rgba(255, 255, 255, 0.6);
    font-size: 13px;
    text-align: center;
    margin-bottom: 25px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    color: rgba(255, 255, 255, 0.8);
    font-size: 12px;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .form-group input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    font-size: 14px;
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.2s, background 0.2s;
  }

  .form-group input:focus {
    border-color: #f2a13c;
    background: rgba(255, 255, 255, 0.08);
  }

  #loginBtn {
    width: 100%;
    padding: 12px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-weight: 700;
    font-size: 15px;
    color: #1a1005;
    background: linear-gradient(90deg, #d9f2c4, #f2a13c, #e8503a);
    box-shadow: 0 8px 24px rgba(232, 80, 58, 0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    margin-top: 10px;
  }

  #loginBtn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(242, 161, 60, 0.35);
  }

  #loginBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #errorMsg {
    margin-top: 15px;
    font-size: 13px;
    color: #ff6b6b;
    text-align: center;
    min-height: 18px;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="net"></canvas>
  <div class="login-card">
    <h2>Administrador</h2>
    <p>Ingresa tus credenciales para acceder al panel</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="admin@correo.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" id="loginBtn">Entrar</button>
      <div id="errorMsg"></div>
    </form>
  </div>
</div>

<script>
  // ATENCIÓN: Reemplaza con tus claves de Supabase
  const SUPABASE_URL = 'https://rrqtakkrirvgxdkzhkqn.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJycXRha2tyaXJ2Z3hka3poa3FuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNzYwODMsImV4cCI6MjA5OTY1MjA4M30.A1sKtEgMftusFCc9MxPjcrMqp6cY-3VkLKiPn_etOJI';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const loginForm = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMsg');

  // Redirigir al panel si ya hay una sesión activa
  async function checkExistingSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      window.location.href = 'admin.html';
    }
  }

  // Manejar el inicio de sesión
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginBtn.disabled = true;
    errorMsg.textContent = '';

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const { data, error } = await supabase.auth.signInWithPassword({
      email: email,
      password: password,
    });

    if (error) {
      errorMsg.textContent = 'Credenciales incorrectas o usuario no encontrado.';
      loginBtn.disabled = false;
    } else {
      window.location.href = 'admin.html';
    }
  });

  // --- Fondo Animado (Canvas de partículas en red) ---
  const canvas = document.getElementById('net');
  const ctx = canvas.getContext('2d');
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  const points = [];
  const maxPoints = 50;
  const connectionDist = 120;

  class Point {
    constructor() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.vx = (Math.random() - 0.5) * 0.8;
      this.vy = (Math.random() - 0.5) * 0.8;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      if (this.x < 0 || this.x > width) this.vx *= -1;
      if (this.y < 0 || this.y > height) this.vy *= -1;
    }
  }

  for (let i = 0; i < maxPoints; i++) {
    points.push(new Point());
  }

  function animate() {
    ctx.clearRect(0, 0, width, height);
    for (let i = 0; i < points.length; i++) {
      const p1 = points[i];
      p1.update();
      for (let j = i + 1; j < points.length; j++) {
        const p2 = points[j];
        const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
        if (dist < connectionDist) {
          const alpha = (1 - dist / connectionDist) * 0.15;
          ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

  checkExistingSession();
  animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirameter - Acceso Administrador</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0d0614;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(135deg, #0f3e54 0%, #1b0e24 50%, #5c140a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  #net {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    opacity: 0.4;
  }
  
  .login-card {
    position: relative;
    width: 85%;
    max-width: 380px;
    background: rgba(255, 255, 255, 0.03);
    padding: 40px 30px;
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    z-index: 5;
    box-sizing: border-box;
  }

  .login-card h2 {
    color: #fff;
    margin: 0 0 10px 0;
    font-size: 22px;
    font-weight: 600;
    text-align: center;
  }

  .login-card p {
    color: rgba(255, 255, 255, 0.6);
    font-size: 13px;
    text-align: center;
    margin-bottom: 25px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    color: rgba(255, 255, 255, 0.8);
    font-size: 12px;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .form-group input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    font-size: 14px;
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.2s, background 0.2s;
  }

  .form-group input:focus {
    border-color: #f2a13c;
    background: rgba(255, 255, 255, 0.08);
  }

  #loginBtn {
    width: 100%;
    padding: 12px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-weight: 700;
    font-size: 15px;
    color: #1a1005;
    background: linear-gradient(90deg, #d9f2c4, #f2a13c, #e8503a);
    box-shadow: 0 8px 24px rgba(232, 80, 58, 0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    margin-top: 10px;
  }

  #loginBtn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(242, 161, 60, 0.35);
  }

  #loginBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #errorMsg {
    margin-top: 15px;
    font-size: 13px;
    color: #ff6b6b;
    text-align: center;
    min-height: 18px;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="net"></canvas>
  <div class="login-card">
    <h2>Administrador</h2>
    <p>Ingresa tus credenciales para acceder al panel</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="admin@correo.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" id="loginBtn">Entrar</button>
      <div id="errorMsg"></div>
    </form>
  </div>
</div>
<script>
  // 1. REEMPLAZA ESTOS DOS VALORES CON TUS CLAVES REALES DE SUPABASE
  const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co';
  const SUPABASE_KEY = 'TU-ANON-KEY';

  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const adminSlider = document.getElementById('adminSlider');
  const adminValue = document.getElementById('adminValue');
  const saveBtn = document.getElementById('saveBtn');
  const statusMsg = document.getElementById('statusMsg');

  // Función para verificar sesión antes de mostrar el contenido
  async function checkAuth() {
    try {
      const { data: { session }, error } = await supabase.auth.getSession();
      
      if (error || !session) {
        // Si no hay sesión, manda inmediatamente al login
        window.location.href = 'login.html';
        return;
      }

      // Si sí hay sesión, hace visible el panel y carga el valor actual
      document.getElementById('sliderWrap').style.display = 'block';
      statusMsg.textContent = "El Kirameter está listo para ser actualizado";
      statusMsg.style.color = "rgba(255,255,255,0.8)";
      loadInitialValue();
    } catch (err) {
      // Si falla la URL de Supabase o la clave, redirige al login por seguridad
      window.location.href = 'login.html';
    }
  }

  async function loadInitialValue() {
    const { data, error } = await supabase
      .from('kirameter')
      .select('value')
      .eq('id', 1)
      .single();

    if (data) {
      adminSlider.value = data.value;
      adminValue.textContent = data.value + '%';
    }
  }

  adminSlider.addEventListener('input', (e) => {
    adminValue.textContent = e.target.value + '%';
  });

  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    saveBtn.textContent = "Guardando...";
    statusMsg.textContent = "Enviando actualización...";

    const newValue = parseInt(adminSlider.value);

    const { error } = await supabase
      .from('kirameter')
      .update({ value: newValue })
      .eq('id', 1);

    if (error) {
      statusMsg.textContent = "Error al guardar: " + error.message;
      statusMsg.style.color = "#ff4d4d";
    } else {
      statusMsg.textContent = "¡Cambio guardado exitosamente!";
      statusMsg.style.color = "#00ffcc";
    }

    saveBtn.disabled = false;
    saveBtn.textContent = "Guardar Cambio Global";
  });

  async function logout() {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  }

  // Ejecutar verificación al cargar la página
  checkAuth();
</script>
</body>
</html>
